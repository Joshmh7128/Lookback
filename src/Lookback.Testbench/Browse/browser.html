<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lookback datasets and profiles</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --ink:#e8ebf1; --dim:#8c94a4; --faint:#4b5262; --line:#272c36;
    --accent:#7aa2ff; --good:#3ecf7a; --warn:#f0b44c; --bad:#ff6363; --region:#c58bff; --video:#5aa9ff; --audio:#f0a35a;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  code, .mono { font-family:ui-monospace, "Cascadia Mono", Consolas, monospace; font-size:12.5px; }
  header { position:sticky; top:0; z-index:5; display:flex; gap:16px; align-items:center; padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:15px; font-weight:600; white-space:nowrap; } header h1 span { color:var(--dim); font-weight:400; }
  #q { flex:1; max-width:520px; font:inherit; padding:6px 10px; border-radius:7px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  header .hint { color:var(--faint); font-size:12px; }
  .layout { display:grid; grid-template-columns:290px minmax(0,1fr); min-height:calc(100vh - 50px); }
  nav { border-right:1px solid var(--line); padding:10px 0 40px; background:var(--panel); position:sticky; top:50px; height:calc(100vh - 50px); overflow:auto; }
  nav h3 { margin:14px 16px 6px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  nav a.item { display:flex; align-items:center; gap:8px; padding:4px 16px; color:var(--ink); font-size:13.5px; }
  nav a.item:hover { background:var(--panel2); text-decoration:none; }
  nav a.item.on { background:var(--panel2); box-shadow:inset 3px 0 var(--accent); }
  nav a.item .n { margin-left:auto; color:var(--faint); font-size:12px; }
  nav a.item.hide { display:none; }
  main { padding:20px 26px 60px; max-width:1280px; }
  h2 { font-size:24px; margin:0 0 4px; } h2 small { font-size:14px; color:var(--dim); font-weight:400; margin-left:8px; }
  h3.sec { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:26px 0 10px; display:flex; gap:10px; align-items:baseline; }
  h3.sec small { text-transform:none; letter-spacing:0; color:var(--faint); font-weight:400; }
  .crumbs { color:var(--dim); margin-bottom:10px; font-size:13px; }
  .chip { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11.5px; background:var(--panel2); color:var(--dim); border:1px solid var(--line); white-space:nowrap; }
  .chip.game { color:var(--accent); } .chip.subgame { color:var(--region); } .chip.mode { color:var(--warn); }
  .chip.good { color:var(--good); } .chip.bad { color:var(--bad); } .chip.warn { color:var(--warn); }
  .chip.region { color:var(--region); } .chip.video { color:var(--video); } .chip.audio { color:var(--audio); }
  .facts { display:flex; flex-wrap:wrap; gap:10px 26px; margin:12px 0 4px; color:var(--dim); font-size:13px; }
  .facts b { color:var(--ink); font-weight:500; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .grid { display:grid; gap:12px; }
  .stats { grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); }
  .stat b { display:block; font-size:26px; font-weight:650; } .stat span { color:var(--dim); font-size:12.5px; }
  .two { grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); } @media (max-width:1100px) { .two { grid-template-columns:minmax(0,1fr); } .layout { grid-template-columns:220px minmax(0,1fr); } }
  .ev { padding:12px 14px; border-top:1px solid var(--line); }
  .ev:first-child { border-top:0; }
  .ev .top { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .ev .name { font-weight:650; font-size:15px; }
  .ev .sum { color:var(--ink); margin:6px 0 4px; }
  .ev ul { margin:4px 0 0; padding-left:18px; color:var(--dim); font-size:13px; } .ev li code { color:var(--ink); }
  .ev .meta { display:flex; flex-wrap:wrap; gap:6px 18px; color:var(--dim); font-size:12.5px; margin-top:6px; }
  .wbar { display:inline-block; vertical-align:middle; height:8px; border-radius:4px; background:var(--accent); }
  .wtrack { display:inline-block; width:90px; height:8px; border-radius:4px; background:var(--panel2); vertical-align:middle; overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 10px; border-top:1px solid var(--line); vertical-align:top; }
  th { color:var(--dim); font-weight:500; border-top:0; white-space:nowrap; }
  td.r, th.r { text-align:right; } tr.click { cursor:pointer; } tr.click:hover td { background:var(--panel2); }
  .bad-t { color:var(--bad); } .good-t { color:var(--good); } .warn-t { color:var(--warn); } .dim { color:var(--dim); }
  svg text { fill:var(--dim); font:11px system-ui, sans-serif; }
  .map rect.reg { fill:rgba(197,139,255,.12); stroke:var(--region); stroke-width:1.5; cursor:pointer; }
  .map rect.reg.inh { fill:rgba(140,148,164,.10); stroke:var(--dim); stroke-dasharray:4 3; }
  .map rect.reg.hl { fill:rgba(122,162,255,.35); stroke:var(--accent); stroke-width:2.5; }
  .map text.lab { fill:var(--ink); font-size:11px; pointer-events:none; }
  .comp { display:grid; grid-template-columns:minmax(0,1.3fr) 100px minmax(0,1.4fr); gap:10px; align-items:center; padding:6px 0; border-top:1px solid var(--line); font-size:13px; cursor:default; }
  .comp:first-child { border-top:0; }
  .comp .sig { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .comp.unknown .sig code { color:var(--bad); text-decoration:line-through; }
  .warnbox { border:1px solid rgba(240,180,76,.35); background:rgba(240,180,76,.07); border-radius:8px; padding:8px 12px; margin:6px 0; color:var(--warn); font-size:13px; }
  .badbox { border-color:rgba(255,99,99,.35); background:rgba(255,99,99,.07); color:var(--bad); }
  .filters { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin:8px 0 10px; font-size:13px; color:var(--dim); }
  .filters input[type=text], .filters select { font:inherit; padding:4px 8px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  .bars .row { display:grid; grid-template-columns:160px 1fr 44px; gap:10px; align-items:center; font-size:13px; padding:2px 0; }
  .bars .row .b { height:10px; border-radius:5px; }
  .empty { color:var(--dim); padding:10px 0; }
  .tip { position:fixed; pointer-events:none; background:#000d; color:var(--ink); padding:6px 9px; border-radius:6px; font-size:12px; max-width:340px; z-index:20; display:none; }
</style>
</head>
<body>
<header>
  <h1>Lookback <span>datasets and profiles</span></h1>
  <input id="q" type="search" placeholder="Search profiles, events, signals, regions, footage, labels…" autocomplete="off">
  <span class="hint"><kbd>/</kbd> to search</span>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div class="tip" id="tip"></div>
<script type="application/json" id="data">__DATA__</script>
<script>
"use strict";
(() => {
  const D = JSON.parse(document.getElementById("data").textContent);
  const P = new Map(D.profiles.map(p => [p.id, p]));
  const SIG = new Map(D.signals.map(s => [s.name, s]));
  const main = document.getElementById("main"), nav = document.getElementById("nav"), tip = document.getElementById("tip");

  // ------------------------------------------------------------- helpers (text only, never innerHTML with data)
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === undefined || v === null || v === false) continue;
      if (k === "class") el.className = v; else if (k.startsWith("on")) el[k] = v; else if (k === "style") el.style.cssText = v; else el.setAttribute(k, v);
    }
    for (const k of kids.flat(Infinity)) if (k !== null && k !== undefined && k !== false) el.append(k instanceof Node ? k : String(k));
    return el;
  }
  function s(tag, attrs, ...kids) {
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v !== undefined && v !== null) el.setAttribute(k, v);
    for (const k of kids.flat(Infinity)) if (k) el.append(k instanceof Node ? k : document.createTextNode(String(k)));
    return el;
  }
  const chip = (text, cls) => h("span", { class: "chip " + (cls || "") }, text);
  const pct = (v) => v === null || v === undefined || isNaN(v) ? "–" : Math.round(v * 100) + "%";
  const prec = (x) => x.tp + x.fp ? x.tp / (x.tp + x.fp) : NaN;
  const rec = (x) => x.tp + x.fn ? x.tp / (x.tp + x.fn) : NaN;
  const sec = (v) => v.toFixed(1) + " s";
  const plink = (id) => P.has(id) ? h("a", { href: "#profile/" + id }, id) : h("span", { class: "bad-t" }, id);
  function tipOn(el, text) {
    el.addEventListener("mousemove", ev => { tip.textContent = text; tip.style.display = "block"; tip.style.left = Math.min(ev.clientX + 14, innerWidth - 360) + "px"; tip.style.top = ev.clientY + 14 + "px"; });
    el.addEventListener("mouseleave", () => tip.style.display = "none");
    return el;
  }
  function sigEl(name) {
    const info = SIG.get(name);
    const el = h("code", {}, name);
    return tipOn(el, info ? (info.meaning || info.family + " signal") : "Unknown signal: the pipeline does not produce it.");
  }
  function condLi(c) {
    const words = { above: "is above", below: "is below", rise: "rises" }[c.test] || c.test;
    return h("li", {}, sigEl(c.signal), " ", words, " ", h("b", {}, String(+c.value.toFixed(4))), c.test === "rise" ? " over its own recent baseline" : "");
  }
  const levelChip = (p) => chip(p.level, p.level);

  // ------------------------------------------------------------- search index
  function profileText(p) {
    return [p.id, p.displayName, p.level, ...p.events.map(e => e.name + " " + e.summary), ...p.composites.map(c => c.name),
      ...p.regions.map(r => r.name + " " + r.purpose), ...p.components.map(c => c.signal), ...p.executables].join(" ").toLowerCase();
  }
  function entryText(d, e) {
    return [d.game, d.manifest, e.file, e.title, e.source, e.profile, e.retention, ...e.labels.map(l => l.event)].join(" ").toLowerCase();
  }

  // ------------------------------------------------------------- nav
  function buildNav() {
    nav.replaceChildren();
    nav.append(h("a", { class: "item", href: "#", "data-k": "overview" }, "Overview"));
    nav.append(h("h3", {}, "Profiles"));
    for (const g of D.games) for (const p of D.profiles.filter(x => x.path[0] === g)) {
      const depth = p.path.length - 1;
      nav.append(h("a", { class: "item", href: "#profile/" + p.id, "data-k": "profile/" + p.id, "data-s": profileText(p), style: "padding-left:" + (16 + depth * 16) + "px" },
        p.displayName, p.warnings.some(w => w.includes("never fire")) ? h("span", { class: "bad-t" }, "●") : null,
        h("span", { class: "n" }, p.events.length + p.composites.length)));
    }
    nav.append(h("h3", {}, "Datasets"));
    if (!D.datasets.length) nav.append(h("div", { class: "empty", style: "padding:4px 16px" }, "No manifests found."));
    D.datasets.forEach((d, i) => {
      nav.append(h("a", { class: "item", href: "#dataset/" + i, "data-k": "dataset/" + i, "data-s": d.entries.map(e => entryText(d, e)).join(" ") + " " + d.manifest.toLowerCase() },
        d.game, d.example ? chip("example") : null, h("span", { class: "n" }, d.entries.length)));
    });
  }
  function markNav(key) {
    for (const a of nav.querySelectorAll("a.item")) a.classList.toggle("on", a.dataset.k === key);
  }

  // ------------------------------------------------------------- overview
  function overview() {
    const events = D.profiles.reduce((a, p) => a + p.events.filter(e => e.from === p.id).length + p.composites.filter(c => c.from === p.id).length, 0);
    const entries = D.datasets.flatMap(d => d.entries);
    const labels = entries.reduce((a, e) => a + e.labels.length, 0);
    main.append(h("h2", {}, "Overview"));
    main.append(h("p", { class: "dim" }, "Every game profile Lookback ships, what each one recognises and from which signals, and the labelled footage that tests it. Pick a profile or a dataset on the left, or search."));
    main.append(h("div", { class: "grid stats" },
      [[D.games.length, "games"], [D.profiles.length, "profiles"], [events, "event and composite rules"], [D.datasets.length, "dataset manifests"], [entries.length, "footage entries"], [labels, "labelled moments"]]
        .map(([n, l]) => h("div", { class: "card stat" }, h("b", {}, n), h("span", {}, l)))));

    main.append(h("h3", { class: "sec" }, "Games"));
    const t = h("table", {}, h("tr", {}, ["Game", "Profiles", "Events", "Regions", "Calibrated", "Footage", "Labels", "Untested events"].map((x, i) => h("th", { class: i > 0 ? "r" : "" }, x))));
    for (const g of D.games) {
      const tree = D.profiles.filter(p => p.path[0] === g), root = P.get(g);
      const ownEvents = tree.reduce((a, p) => a + p.events.filter(e => e.from === p.id).length + p.composites.filter(c => c.from === p.id).length, 0);
      const regions = new Set(tree.flatMap(p => p.regions.map(r => r.name))).size;
      t.append(h("tr", { class: "click", onclick: () => location.hash = "#profile/" + g },
        h("td", {}, h("b", {}, root.displayName), " ", h("span", { class: "dim mono" }, g)),
        h("td", { class: "r" }, tree.length), h("td", { class: "r" }, ownEvents), h("td", { class: "r" }, regions),
        h("td", { class: "r" }, root.reference.calibrated ? h("span", { class: "good-t" }, "yes") : regions ? h("span", { class: "warn-t" }, "no") : "–"),
        h("td", { class: "r" }, root.coverage.entries), h("td", { class: "r" }, Object.values(root.coverage.labelsByEvent).reduce((a, b) => a + b, 0)),
        h("td", { class: "r" }, root.coverage.unlabelled.length)));
    }
    main.append(h("div", { class: "card", style: "padding:4px 6px" }, t));

    const problems = [
      ...D.profiles.flatMap(p => p.warnings.filter(w => w.includes("never fire")).map(w => ["#profile/" + p.id, p.id, w])),
      ...D.datasets.flatMap((d, i) => [...d.problems.map(x => ["#dataset/" + i, d.manifest, x]), ...d.entries.flatMap(e => e.issues.map(x => ["#entry/" + i + "/" + e.index, d.game + " · " + e.file, x]))]),
    ];
    main.append(h("h3", { class: "sec" }, "Needs attention", h("small", {}, problems.length ? problems.length + " item(s)" : "nothing")));
    if (problems.length) main.append(h("div", { class: "card" }, problems.map(([href, what, text]) => h("div", { class: "warnbox" }, h("a", { href }, what), ": ", text))));
    for (const n of D.notes) main.append(h("div", { class: "warnbox" }, n));
  }

  // ------------------------------------------------------------- profile
  function profile(id) {
    const p = P.get(id);
    if (!p) { main.append(h("h2", {}, "No profile " + id)); return; }
    main.append(h("div", { class: "crumbs" }, p.path.map((x, i) => [i ? " › " : "", x === id ? x : plink(x)])));
    main.append(h("h2", {}, p.displayName, h("small", { class: "mono" }, p.id), " ", levelChip(p)));
    const children = p.children.length ? [" · children: ", p.children.map((c, i) => [i ? ", " : "", plink(c)])] : [];
    main.append(h("div", { class: "facts" },
      h("span", {}, "version ", h("b", {}, p.version)),
      p.executables.length ? h("span", {}, "executable ", h("b", { class: "mono" }, p.executables.join(", "))) : null,
      h("span", {}, "present hook ", p.capture.allowPresentHook ? chip("allowed", "warn") : chip("never", "good")),
      h("span", {}, "memory reading ", p.capture.allowMemoryReading ? chip("allowed", "warn") : chip("never", "good")),
      h("span", {}, "regions ", p.reference.calibrated ? chip("calibrated", "good") : p.regions.length ? chip("estimates", "warn") : chip("none")),
      h("span", {}, children)));
    if (p.capture.notes) main.append(h("p", { class: "dim", style: "margin:6px 0" }, p.capture.notes));
    for (const w of p.warnings) main.append(h("div", { class: "warnbox" + (w.includes("never fire") ? " badbox" : "") }, w));

    // What it identifies
    const own = p.events.filter(e => e.from === p.id).length + p.composites.filter(c => c.from === p.id).length;
    main.append(h("h3", { class: "sec" }, "What it identifies",
      h("small", {}, `${p.events.length} events and ${p.composites.length} composites, ${own} defined here; most prominent first (weight, plus the composites built on it)`)));
    const maxW = Math.max(1, ...p.events.map(e => effective(p, e)));
    const evCard = h("div", { class: "card", style: "padding:0" });
    if (!p.events.length) evCard.append(h("div", { class: "empty", style: "padding:14px" }, "No events: this profile only refines detection."));
    for (const e of p.events) {
      const w = effective(p, e), lb = p.coverage.labelsByEvent[e.name] || 0, sc = p.coverage.scores.find(x => x.event === e.name);
      evCard.append(h("div", { class: "ev", id: "ev-" + e.name },
        h("div", { class: "top" },
          h("span", { class: "name" }, e.name),
          tipOn(h("span", { class: "wtrack" }, h("span", { class: "wbar", style: "width:" + (w / maxW * 100) + "%" })), `weight ${e.weight}` + (w > e.weight ? `, ${w.toFixed(2)} with composites` : "")),
          e.from === p.id ? (e.replaces ? chip("replaces " + e.replaces + "'s", "warn") : chip("defined here", "good")) : h("span", { class: "chip" }, "from ", plink(e.from)),
          lb ? chip(lb + " labelled", "good") : chip("no labels", "warn"),
          sc ? chip(`precision ${pct(prec(sc))} · recall ${pct(rec(sc))}`, rec(sc) >= .8 && prec(sc) >= .8 ? "good" : "warn") : null),
        h("div", { class: "sum" }, e.summary),
        e.when.length ? [h("div", { class: "dim", style: "font-size:12.5px" }, "All of:"), h("ul", {}, e.when.map(condLi))] : null,
        e.whenAny.length ? [h("div", { class: "dim", style: "font-size:12.5px" }, e.when.length ? "And any of:" : "Any of:"), h("ul", {}, e.whenAny.map(condLi))] : null,
        e.boosts.length ? [h("div", { class: "dim", style: "font-size:12.5px" }, "Corroborated by:"), h("ul", {}, e.boosts.map(b => h("li", {}, "+" + b.add + " confidence if ", sigEl(b.signal), " is above " + b.above + " within " + b.withinMs + " ms")))] : null,
        h("div", { class: "meta" },
          h("span", {}, "confidence ", h("b", {}, e.baseConfidence.toFixed(2)), e.maxConfidence > e.baseConfidence ? " to " + e.maxConfidence.toFixed(2) : ""),
          h("span", {}, "cooldown ", h("b", {}, e.cooldownMs + " ms")),
          h("span", {}, "clip ", h("b", {}, `${(e.preMs / 1000).toFixed(1)} s before, ${(e.postMs / 1000).toFixed(1)} s after`)),
          e.usedByComposites.length ? h("span", {}, "feeds ", e.usedByComposites.join(", ")) : null)));
    }
    main.append(evCard);
    if (p.composites.length) {
      const t = h("table", {}, h("tr", {}, ["Composite", "Pattern", "Weight", "Clip", "Defined in"].map(x => h("th", {}, x))));
      for (const c of p.composites) t.append(h("tr", {}, h("td", {}, h("b", {}, c.name)), h("td", {}, c.summary), h("td", {}, c.weight), h("td", {}, `${c.preMs / 1000} s / ${c.postMs / 1000} s`), h("td", {}, plink(c.from))));
      main.append(h("div", { class: "card", style: "margin-top:12px;padding:4px 6px" }, t));
    }
    if (p.disabled.length) main.append(h("p", { class: "dim" }, "Switched off from the parent: ", p.disabled.join(", ")));

    // Components + map
    main.append(h("h3", { class: "sec" }, "Prominent components", h("small", {}, "the signals and screen regions the rules read, ranked by how much rides on them; hover a region to see what uses it")));
    const grid = h("div", { class: "grid two" });
    const comps = h("div", { class: "card" });
    const maxI = Math.max(1, ...p.components.map(c => c.influence));
    if (!p.components.length) comps.append(h("div", { class: "empty" }, "No signals used."));
    for (const c of p.components) {
      const row = h("div", { class: "comp" + (c.known ? "" : " unknown") },
        h("div", { class: "sig" }, chip(c.kind, c.kind), " ", sigEl(c.signal)),
        h("span", { class: "wtrack", style: "width:100%" }, h("span", { class: "wbar", style: "width:" + (c.influence / maxI * 100) + "%;background:var(--" + (c.kind === "region" ? "region" : c.kind) + ")" })),
        h("div", { class: "dim", style: "font-size:12.5px" },
          c.triggers.length ? ["triggers ", h("b", { style: "color:var(--ink)" }, c.triggers.join(", "))] : null,
          c.boosts.length ? [c.triggers.length ? "; " : "", "boosts ", c.boosts.join(", ")] : null,
          c.fingerprint ? [(c.triggers.length || c.boosts.length) ? "; " : "", "fingerprint"] : null));
      if (c.region) { row.onmouseenter = () => hl(c.region, true); row.onmouseleave = () => hl(c.region, false); }
      comps.append(row);
    }
    grid.append(comps, h("div", { class: "card" }, regionMap(p)));
    main.append(grid);

    // Detection
    main.append(h("h3", { class: "sec" }, "How it is detected"));
    const det = h("div", { class: "card" }, h("p", { style: "margin:0 0 8px" }, p.detect.summary));
    if (p.detect.hints.length) {
      const t = h("table", {}, h("tr", {}, ["Hint source", "Pattern", "Must equal"].map(x => h("th", {}, x))));
      for (const x of p.detect.hints) t.append(h("tr", {}, h("td", {}, x.source), h("td", {}, h("code", {}, x.regex)), h("td", {}, h("code", {}, x.values.join(", ") || "any match"))));
      det.append(t);
    }
    if (p.detect.visual.length) det.append(h("div", { class: "dim", style: "margin-top:8px" }, "Fingerprint:"), h("ul", {}, p.detect.visual.map(condLi)));
    if (p.children.length) {
      det.append(h("div", { class: "dim", style: "margin-top:10px" }, "Beneath it:"));
      det.append(h("ul", {}, p.children.map(c => { const x = P.get(c); return h("li", {}, plink(c), " ", levelChip(x), " ", h("span", { class: "dim" }, x.detect.summary)); })));
    }
    main.append(det);

    // Coverage
    main.append(h("h3", { class: "sec" }, "Dataset coverage", h("small", {}, `${p.coverage.entries} footage entr${p.coverage.entries === 1 ? "y" : "ies"} show this profile or one beneath it`)));
    const cov = h("div", { class: "card" });
    const lbe = Object.entries(p.coverage.labelsByEvent);
    if (lbe.length) cov.append(bars(lbe));
    else cov.append(h("div", { class: "empty" }, "No labelled moments for this profile yet. Add entries with labels to a manifest under datasets/" + p.path[0] + "/."));
    if (p.coverage.unlabelled.length) cov.append(h("div", { class: "warnbox" }, "Never labelled, so never tested: " + p.coverage.unlabelled.join(", ")));
    if (p.coverage.unknownLabels.length) cov.append(h("div", { class: "warnbox badbox" }, "Labels naming events this profile does not define: " + p.coverage.unknownLabels.join(", ")));
    if (p.coverage.scores.length) cov.append(scoreTable(p.coverage.scores));
    main.append(cov);
  }

  function effective(p, e) { return e.weight + p.composites.filter(c => c.of === e.name).reduce((a, c) => a + c.weight, 0); }

  function regionMap(p) {
    const W = 480, H = 270;
    const svg = s("svg", { viewBox: `0 0 ${W} ${H + 18}`, width: "100%", class: "map" });
    svg.append(s("rect", { x: 0, y: 0, width: W, height: H, fill: "#0b0d11", stroke: "#272c36" }));
    svg.append(s("text", { x: 6, y: H + 14 }, `${p.reference.aspect} frame · solid: defined here · dashed: inherited`));
    if (!p.regions.length) svg.append(s("text", { x: W / 2, y: H / 2, "text-anchor": "middle" }, "No HUD regions: whole-frame signals only"));
    for (const r of p.regions) {
      const g = s("g", {});
      const rect = s("rect", { class: "reg" + (r.from === p.id ? "" : " inh"), x: r.x * W, y: r.y * H, width: r.w * W, height: r.h * H, "data-r": r.name });
      g.append(rect, s("text", { class: "lab", x: r.x * W + 4, y: r.y * H + 13 }, r.name));
      tipOn(g, `${r.name}${r.from === p.id ? "" : " (from " + r.from + ")"}: ${r.purpose || "no purpose given"}\nUsed by: ${r.usedBy.join(", ") || "nothing"}`);
      g.onmouseenter = () => hl(r.name, true); g.onmouseleave = () => hl(r.name, false);
      svg.append(g);
    }
    return svg;
  }
  function hl(region, on) { for (const r of main.querySelectorAll(`rect.reg[data-r="${CSS.escape(region)}"]`)) r.classList.toggle("hl", on); }

  function bars(pairs, colorOf) {
    const max = Math.max(1, ...pairs.map(x => x[1]));
    return h("div", { class: "bars" }, pairs.map(([k, v]) => h("div", { class: "row" }, h("span", {}, k), h("span", {}, h("span", { class: "b", style: `display:block;width:${v / max * 100}%;background:${colorOf ? colorOf(k) : "var(--accent)"}` })), h("span", { class: "r dim" }, v))));
  }

  const grade = (v) => isNaN(v) ? "dim" : v < .8 ? "warn-t" : "good-t";
  function scoreTable(scores) {
    const t = h("table", { style: "margin-top:10px" }, h("tr", {}, ["Event", "Hits", "False alarms", "Missed", "Precision", "Recall"].map((x, i) => h("th", { class: i ? "r" : "" }, x))));
    for (const x of scores) {
      const pr = prec(x), re = rec(x);
      t.append(h("tr", {}, h("td", {}, x.event), h("td", { class: "r" }, x.tp), h("td", { class: "r" }, x.fp), h("td", { class: "r" }, x.fn),
        h("td", { class: "r " + grade(pr) }, pct(pr)), h("td", { class: "r " + grade(re) }, pct(re))));
    }
    return t;
  }

  // ------------------------------------------------------------- dataset
  const evColor = (name) => { let x = 7; for (const c of name) x = (x * 31 + c.charCodeAt(0)) >>> 0; return `hsl(${x % 360} 70% 62%)`; };
  let filt = { text: "", profile: "", retention: "", labels: false, clips: false, media: false, issues: false, sort: "file" };

  function dataset(i) {
    const d = D.datasets[i];
    if (!d) { main.append(h("h2", {}, "No dataset " + i)); return; }
    main.append(h("div", { class: "crumbs" }, "Dataset · ", h("span", { class: "mono" }, d.manifest)));
    main.append(h("h2", {}, P.has(d.game) ? P.get(d.game).displayName : d.game, " ", d.example ? chip("example manifest", "warn") : null));
    if (d.example) main.append(h("p", { class: "dim" }, "An example: copy it to manifest.json next to your footage and edit it. Its entries are shown so you can see the format; no media is expected."));
    for (const x of d.problems) main.append(h("div", { class: "warnbox badbox" }, x));

    const e = d.entries, labels = e.flatMap(x => x.labels);
    main.append(h("div", { class: "grid stats", style: "margin-top:12px" },
      [[e.length, "entries"], [e.filter(x => x.mediaFound).length, "with media present"], [labels.length, "labelled moments"], [e.reduce((a, x) => a + x.clips.length, 0), "labelled clips"],
       [new Set(e.map(x => x.profile || d.game)).size, "profiles shown"], [e.filter(x => x.issues.length).length, "entries with issues"]]
        .map(([n, l]) => h("div", { class: "card stat" }, h("b", {}, n), h("span", {}, l)))));

    if (d.results) {
      const r = d.results;
      main.append(h("h3", { class: "sec" }, "Latest results", h("small", { class: "mono" }, r.source + " · tolerance " + r.tolerance + " s")));
      main.append(h("div", { class: "card" },
        h("div", { class: "facts", style: "margin-top:0" },
          r.detectionAccuracy !== null ? h("span", {}, "right profile ", h("b", {}, pct(r.detectionAccuracy)), " of labelled time") : null,
          r.candidates ? h("span", {}, "clip candidates: ", h("b", {}, pct(prec(r.candidates))), " precision, ", h("b", {}, pct(rec(r.candidates))), " recall, mean overlap ", h("b", {}, r.candidates.meanIoU.toFixed(2))) : null),
        r.overall.length ? scoreTable(r.overall) : h("div", { class: "empty" }, "No labelled events scored.")));
    } else if (!d.example) {
      main.append(h("p", { class: "dim" }, "No results loaded. Run ", h("code", {}, `lookback-testbench dataset ${d.manifest} --out dataset-out/${d.game}`), " and browse again with ", h("code", {}, `--results dataset-out/${d.game}`), "."));
    }

    if (labels.length) {
      const by = {}; for (const l of labels) by[l.event] = (by[l.event] || 0) + 1;
      main.append(h("h3", { class: "sec" }, "Labelled moments by event"), h("div", { class: "card" }, bars(Object.entries(by).sort((a, b) => b[1] - a[1]), evColor)));
    }

    main.append(h("h3", { class: "sec" }, "Entries", h("small", {}, "filter and sort; click an entry for its detail")));
    const profiles = [...new Set(e.map(x => x.profile || d.game))].sort();
    const box = h("div", {});
    const ctl = (k, el) => { el.oninput = el.onchange = () => { filt[k] = el.type === "checkbox" ? el.checked : el.value; draw(); }; return el; };
    const sel = (k, opts) => { const el = h("select", {}, opts.map(([v, t]) => h("option", { value: v, selected: filt[k] === v ? "" : null }, t))); return ctl(k, el); };
    const chk = (k, t) => h("label", {}, ctl(k, h("input", { type: "checkbox", checked: filt[k] ? "" : null })), " " + t);
    main.append(h("div", { class: "filters" },
      ctl("text", h("input", { type: "text", placeholder: "filter file, source, label…", value: filt.text })),
      sel("profile", [["", "any profile"], ...profiles.map(x => [x, x])]),
      sel("retention", [["", "any retention"], ["owned", "owned"], ["permissioned", "permissioned"], ["open-license", "open-license"]]),
      chk("labels", "has labels"), chk("clips", "has clips"), chk("media", "media present"), chk("issues", "has issues"),
      sel("sort", [["file", "sort: file"], ["labels", "sort: most labels"], ["issues", "sort: most issues"], ["recall", "sort: lowest recall"]])));
    main.append(box);

    function draw() {
      const q = filt.text.toLowerCase();
      let rows = e.filter(x => (!q || entryText(d, x).includes(q)) && (!filt.profile || (x.profile || d.game) === filt.profile) && (!filt.retention || x.retention === filt.retention)
        && (!filt.labels || x.labels.length) && (!filt.clips || x.clips.length) && (!filt.media || x.mediaFound) && (!filt.issues || x.issues.length));
      const recallOf = (x) => { if (!x.result) return 2; const t = x.result.scores.reduce((a, s) => ({ tp: a.tp + s.tp, fp: a.fp + s.fp, fn: a.fn + s.fn }), { tp: 0, fp: 0, fn: 0 }); const r = rec(t); return isNaN(r) ? 2 : r; };
      rows = rows.slice().sort({ file: (a, b) => a.file.localeCompare(b.file), labels: (a, b) => b.labels.length - a.labels.length, issues: (a, b) => b.issues.length - a.issues.length, recall: (a, b) => recallOf(a) - recallOf(b) }[filt.sort]);
      const t = h("table", {}, h("tr", {}, ["Footage", "Profile", "Retention", "Labels", "Clips", "Media", "Result", "Issues"].map((x, i) => h("th", { class: i >= 3 ? "r" : "" }, x))));
      for (const x of rows) {
        const res = x.result;
        t.append(h("tr", { class: "click", onclick: () => location.hash = `#entry/${i}/${x.index}` },
          h("td", {}, h("div", {}, x.title || x.file), h("div", { class: "dim mono", style: "font-size:11.5px" }, x.title ? x.file : x.source)),
          h("td", {}, h("span", { class: "mono" }, x.profile || d.game)),
          h("td", {}, x.retention === "owned" ? x.retention : chip(x.retention, x.permissionRef ? "" : "bad")),
          h("td", { class: "r" }, x.labels.length), h("td", { class: "r" }, x.clips.length),
          h("td", { class: "r" }, x.mediaFound ? h("span", { class: "good-t" }, "✓") : h("span", { class: "dim" }, "missing")),
          h("td", { class: "r" }, res ? `${res.events} events` + (res.detectionAccuracy !== null ? ` · ${pct(res.detectionAccuracy)} right profile` : "") : h("span", { class: "dim" }, "–")),
          h("td", { class: "r" }, x.issues.length ? h("span", { class: "warn-t" }, x.issues.length) : "")));
      }
      box.replaceChildren(rows.length ? h("div", { class: "card", style: "padding:4px 6px" }, t) : h("div", { class: "empty" }, "No entries match."));
    }
    draw();
  }

  // ------------------------------------------------------------- entry
  function entry(di, ei) {
    const d = D.datasets[di], x = d && d.entries.find(e => e.index === ei);
    if (!x) { main.append(h("h2", {}, "No entry")); return; }
    const prof = x.profile || d.game;
    main.append(h("div", { class: "crumbs" }, h("a", { href: "#dataset/" + di }, d.game + " dataset"), " › entry " + (ei + 1)));
    main.append(h("h2", {}, x.title || x.file));
    main.append(h("div", { class: "facts" },
      h("span", {}, "file ", h("b", { class: "mono" }, x.file), " ", x.mediaFound ? chip("present", "good") : chip("not found", "warn")),
      h("span", {}, "shows ", plink(prof)),
      h("span", {}, "retention ", h("b", {}, x.retention)),
      x.source ? h("span", {}, "source ", h("b", {}, x.source)) : null));
    if (x.permissionRef) main.append(h("p", { class: "dim" }, "Permission: " + x.permissionRef));
    for (const w of x.issues) main.append(h("div", { class: "warnbox" }, w));

    main.append(h("h3", { class: "sec" }, "Labelled timeline", h("small", {}, "moments as ticks, clips as bands")));
    const end = Math.max(10, ...x.labels.map(l => l.at), ...x.clips.map(c => c.end)) * 1.05;
    const names = [...new Set(x.labels.map(l => l.event))];
    const W = 1000, rowH = 26, H = Math.max(1, names.length) * rowH + 40, X = (t) => 120 + t / end * (W - 130);
    const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%" });
    for (const c of x.clips) tipOn(svg.appendChild(s("rect", { x: X(c.start), y: 4, width: Math.max(2, X(c.end) - X(c.start)), height: H - 34, fill: "rgba(122,162,255,.14)", stroke: "rgba(122,162,255,.5)" })), `clip ${sec(c.start)} to ${sec(c.end)}`);
    names.forEach((n, k) => {
      const y = 10 + k * rowH;
      svg.append(s("text", { x: 6, y: y + 12, fill: evColor(n) }, n));
      for (const l of x.labels.filter(l => l.event === n)) tipOn(svg.appendChild(s("rect", { x: X(l.at) - 2, y, width: 4, height: rowH - 8, fill: evColor(n), rx: 1 })), `${n} at ${sec(l.at)}`);
    });
    const step = end > 600 ? 60 : end > 150 ? 15 : end > 60 ? 10 : end > 20 ? 5 : 1;
    for (let t = 0; t <= end; t += step) { svg.append(s("line", { x1: X(t), x2: X(t), y1: H - 30, y2: H - 24, stroke: "#4b5262" })); svg.append(s("text", { x: X(t), y: H - 12, "text-anchor": "middle" }, t + "s")); }
    main.append(h("div", { class: "card" }, x.labels.length || x.clips.length ? svg : h("div", { class: "empty" }, "No labels or clips. Unlabelled footage still teaches fingerprints and shows what the profile fires on.")));

    if (x.labels.length) {
      const t = h("table", {}, h("tr", {}, ["Time", "Event", "In profile?"].map(v => h("th", {}, v))));
      const p = P.get(prof), known = p ? new Set([...p.events.map(e => e.name), ...p.composites.map(c => c.name)]) : new Set();
      for (const l of x.labels) t.append(h("tr", {}, h("td", { class: "mono" }, sec(l.at)), h("td", {}, h("span", { style: "color:" + evColor(l.event) }, "■ "), known.has(l.event) ? h("a", { href: `#profile/${prof}` }, l.event) : l.event), h("td", {}, known.has(l.event) ? h("span", { class: "good-t" }, "yes") : h("span", { class: "bad-t" }, "no"))));
      main.append(h("div", { class: "card", style: "margin-top:12px;padding:4px 6px" }, t));
    }

    main.append(h("h3", { class: "sec" }, "Result"));
    const r = x.result;
    if (!r) main.append(h("p", { class: "dim" }, d.example ? "Example entries have no results." : "Not run yet, or no results loaded (see the dataset page)."));
    else main.append(h("div", { class: "card" },
      h("div", { class: "facts", style: "margin-top:0" },
        h("span", {}, h("b", {}, r.events), " events detected"),
        r.finalProfile ? h("span", {}, "ended on ", plink(r.finalProfile)) : null,
        r.detectionAccuracy !== null ? h("span", {}, "right profile ", h("b", {}, pct(r.detectionAccuracy)), " of the time") : null,
        r.candidates ? h("span", {}, "clips: ", h("b", {}, r.candidates.tp), " matched, ", r.candidates.fp, " extra, ", r.candidates.fn, " missed") : null,
        r.report ? h("a", { href: r.report }, "open the timeline report →") : null),
      r.scores.length ? scoreTable(r.scores) : null));
  }

  // ------------------------------------------------------------- routing + search
  function route() {
    main.replaceChildren(); tip.style.display = "none";
    const [kind, a, b] = location.hash.replace(/^#/, "").split("/");
    if (kind === "profile") { profile(decodeURIComponent(a)); markNav("profile/" + a); }
    else if (kind === "dataset") { dataset(+a); markNav("dataset/" + a); }
    else if (kind === "entry") { entry(+a, +b); markNav("dataset/" + a); }
    else { overview(); markNav("overview"); }
    scrollTo(0, 0);
  }
  const q = document.getElementById("q");
  q.oninput = () => {
    const v = q.value.trim().toLowerCase();
    for (const a of nav.querySelectorAll("a.item[data-s]")) a.classList.toggle("hide", v !== "" && !a.dataset.s.includes(v));
    if (location.hash.startsWith("#dataset/")) { filt.text = q.value; route(); }
  };
  addEventListener("keydown", ev => { if (ev.key === "/" && document.activeElement !== q && !(document.activeElement instanceof HTMLInputElement)) { ev.preventDefault(); q.focus(); } });
  addEventListener("hashchange", route);
  buildNav(); route();
})();
</script>
</body>
</html>
