name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the product platform. Linux keeps the platform-neutral
        # core (bus, framing, session log) honest and is faster for PRs.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # FileSource and the testbench decode footage with ffmpeg.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # The Chocolatey community feed sometimes times out (HTTP 504) and choco
      # then exits successfully with nothing installed. Retry, and fail this
      # step, not the tests, if ffmpeg is still missing.
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($i = 1; $i -le 4; $i++) {
            choco install ffmpeg -y --no-progress
            Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
            refreshenv | Out-Null
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { ffmpeg -version | Select-Object -First 1; exit 0 }
            Write-Host "ffmpeg not installed (attempt $i); retrying in $(15 * $i) s"
            Start-Sleep -Seconds (15 * $i)
          }
          Write-Error "ffmpeg could not be installed from Chocolatey"
          exit 1
      - run: dotnet restore Lookback.slnx
      - run: dotnet build Lookback.slnx --no-restore -c Release
      - run: dotnet test --solution Lookback.slnx --no-build -c Release

  # The learned clip scorer's training code (ml/): data refusals, calibration,
  # metrics, ONNX export, and that the committed C# test fixture still
  # reproduces with ONNX Runtime. Python only, so Linux.
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
      # Train on synthetic ratings end to end through the command line.
      - name: Train on synthetic ratings
        run: |
          python -m lookback_ml.synth --out "$RUNNER_TEMP/datasets"
          python -m lookback_ml.train --datasets "$RUNNER_TEMP/datasets" --out "$RUNNER_TEMP/model"
          test -s "$RUNNER_TEMP/model/model.onnx"
