name: wiki

# Publishes docs/wiki/ to the repository's GitHub wiki, so the wiki is
# reviewed in pull requests like code and always matches main.
# One-time setup: enable the wiki in Settings and create any first page in
# the web UI; GitHub creates the wiki's git repository on that first save.

on:
  push:
    branches: [main]
    paths: ['docs/wiki/**', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::error::Wiki repository not found. Enable the wiki and create its first page in the web UI, then re-run."
            exit 1
          fi

      - name: Sync pages
        run: |
          rsync -a --delete --exclude '.git' docs/wiki/ wiki/
          cd wiki
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "Sync wiki from ${GITHUB_SHA::7}"
          git push
