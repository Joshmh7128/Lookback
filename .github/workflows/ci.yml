name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the product platform. Linux keeps the platform-neutral
        # core (bus, framing, session log) honest and is faster for PRs.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # FileSource and the testbench decode footage with ffmpeg.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # The Chocolatey community feed sometimes times out (HTTP 504) and choco
      # then exits successfully with nothing installed. Retry, and fail this
      # step, not the tests, if ffmpeg is still missing.
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($i = 1; $i -le 4; $i++) {
            choco install ffmpeg -y --no-progress
            Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
            refreshenv | Out-Null
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { ffmpeg -version | Select-Object -First 1; exit 0 }
            Write-Host "ffmpeg not installed (attempt $i); retrying in $(15 * $i) s"
            Start-Sleep -Seconds (15 * $i)
          }
          Write-Error "ffmpeg could not be installed from Chocolatey"
          exit 1
      - run: dotnet restore Lookback.slnx
      - run: dotnet build Lookback.slnx --no-restore -c Release
      - run: dotnet test --solution Lookback.slnx --no-build -c Release

  # The present hook and the test apps it may run in (native/, C++20, MSVC,
  # warnings as errors), then the hook tests against that build. Runners have
  # no GPU, so the capture tests skip there; the allowlist, marker-export and
  # protocol tests run. The capture tests run on AETHER (see docs/wiki/Testing.md).
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build native (hook + test apps)
        shell: pwsh
        run: ./native/build.ps1 -Config Release
      - run: dotnet build tests/Lookback.Capture.Tests -c Release
      - run: dotnet test --project tests/Lookback.Capture.Tests --no-build -c Release -- --filter-class "*Hook*"
      - uses: actions/upload-artifact@v4
        with:
          name: native-bin
          path: native/out/bin/Release/
          retention-days: 7

  # The learned clip scorer's training code (ml/): data refusals, calibration,
  # metrics, ONNX export, and that the committed C# test fixture still
  # reproduces with ONNX Runtime. Python only, so Linux.
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
      # Train on synthetic ratings end to end through the command line.
      - name: Train on synthetic ratings
        run: |
          python -m lookback_ml.synth --out "$RUNNER_TEMP/datasets"
          python -m lookback_ml.train --datasets "$RUNNER_TEMP/datasets" --out "$RUNNER_TEMP/model"
          test -s "$RUNNER_TEMP/model/model.onnx"

  # The Electron shell in app/. Unit tests run everywhere; on Windows the
  # suite also drives the real recorder over /events and /ingest, and the
  # smoke runs start the whole app (recorder, stream, main window, and the
  # viewer's capture -> crop -> scale -> /ingest path on a synthetic player).
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          global-json-file: global.json
      - name: Build the recorder
        if: runner.os == 'Windows'
        working-directory: .
        run: dotnet build src/Lookback.Recorder/Lookback.Recorder.csproj -c Release
      - name: Install (Linux, no Electron binary needed)
        if: runner.os == 'Linux'
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Install (Windows)
        if: runner.os == 'Windows'
        run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Smoke (app starts, recorder ready, stream open)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LOOKBACK_USER_DATA = Join-Path $env:RUNNER_TEMP "lookback-smoke"
          npx electron . --smoke | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0 -or -not ($out -match "LOOKBACK_SMOKE ok")) { exit 1 }
      - name: Smoke (viewer frames reach the recorder)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LOOKBACK_USER_DATA = Join-Path $env:RUNNER_TEMP "lookback-smoke-viewer"
          npx electron . --smoke-viewer | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0 -or -not ($out -match "LOOKBACK_SMOKE ok")) { exit 1 }
      - name: Smoke (a killed recorder is restarted on a new handshake)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LOOKBACK_USER_DATA = Join-Path $env:RUNNER_TEMP "lookback-smoke-supervise"
          npx electron . --smoke --smoke-supervise | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0 -or -not ($out -match "LOOKBACK_SMOKE ok")) { exit 1 }
      - name: Smoke (storage warnings near and at the clips budget)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LOOKBACK_USER_DATA = Join-Path $env:RUNNER_TEMP "lookback-smoke-storage"
          npx electron . --smoke --smoke-storage | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0 -or -not ($out -match "LOOKBACK_SMOKE ok")) { exit 1 }
