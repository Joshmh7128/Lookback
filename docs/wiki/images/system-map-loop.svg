<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1164 262" width="1164" height="262">
<style>
:root { --bg:#ffffff; --panel:#ffffff; --container:#eaeef3; --ink:#1a2230; --muted:#586274; --line:#c3cbd7; --sess:#a8650f; --plan:#7f8899; --gate:#c0392f;
  --tint-sess:rgba(168,101,15,.08); --tint-gate:rgba(192,57,47,.07); }
@media (prefers-color-scheme: dark) { :root { --bg:#161c26; --panel:#161c26; --container:#131922; --ink:#e3e8f0; --muted:#98a2b4; --line:#2e3746; --sess:#e3a54c; --plan:#737d8f; --gate:#ff7b70;
  --tint-sess:rgba(227,165,76,.09); --tint-gate:rgba(255,123,112,.08); } }
.bg { fill: var(--bg); }
text { font-family: "Segoe UI", "IBM Plex Sans", system-ui, -apple-system, sans-serif; fill: var(--ink); }
.t { font-size: 12.5px; font-weight: 600; } .s { font-size: 11px; fill: var(--muted); }
.m, .cap { font-family: "Cascadia Mono", Consolas, "IBM Plex Mono", ui-monospace, monospace; font-size: 10.5px; fill: var(--muted); }
.cap { letter-spacing: .08em; } .pt { fill: var(--muted); } .sc { fill: var(--sess); } .gc { fill: var(--gate); }
.bx { fill: var(--panel); stroke: var(--ink); stroke-width: 1.3; }
.bx.sess { stroke: var(--sess); stroke-dasharray: 6 4; fill: var(--tint-sess); stroke-width: 1.5; }
.bx.plan { stroke: var(--plan); stroke-dasharray: 2 3; fill: none; stroke-width: 1.4; }
.bx.ext { stroke: var(--line); fill: var(--container); }
.bx.gate { stroke: var(--gate); fill: var(--tint-gate); stroke-width: 1.5; }
.ctr { fill: var(--container); stroke: var(--line); stroke-width: 1.2; } .ctr.sess { stroke: var(--sess); stroke-dasharray: 7 5; }
.ar { stroke: var(--ink); stroke-width: 1.3; fill: none; } .ar.sess { stroke: var(--sess); stroke-dasharray: 5 4; } .ar.plan { stroke: var(--plan); stroke-dasharray: 2 3; }
.gate-line { stroke: var(--gate); stroke-width: 1.6; stroke-dasharray: 7 5; }
.mk { fill: var(--ink); } .mk.sess { fill: var(--sess); } .mk.plan { fill: var(--plan); }
</style>
<rect class="bg" x="0" y="0" width="1164" height="262"/>
<defs>
            <marker id="f3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
            <marker id="f3s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk sess"/></marker>
            <marker id="f3p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk plan"/></marker>
          </defs>

          <rect x="16" y="40" width="160" height="32" rx="6" class="bx"/>
          <text x="96" y="61" text-anchor="middle" class="t">Footage · ffmpeg</text>
          <rect x="16" y="82" width="160" height="32" rx="6" class="bx"/>
          <text x="96" y="103" text-anchor="middle" class="t">Live capture</text>
          <rect x="16" y="124" width="160" height="32" rx="6" class="bx"/>
          <text x="96" y="145" text-anchor="middle" class="t">Official player</text>

          <rect x="216" y="40" width="160" height="116" rx="6" class="bx"/>
          <text x="296" y="88" text-anchor="middle" class="t">Signals</text>
          <text x="296" y="104" text-anchor="middle" class="s">video + audio</text>
          <text x="296" y="118" text-anchor="middle" class="s">game-agnostic</text>
          <line x1="176" y1="56" x2="214" y2="56" class="ar" marker-end="url(#f3a)"/>
          <line x1="176" y1="98" x2="214" y2="98" class="ar" marker-end="url(#f3a)"/>
          <line x1="176" y1="140" x2="214" y2="140" class="ar" marker-end="url(#f3a)"/>

          <rect x="416" y="70" width="160" height="56" rx="6" class="bx"/>
          <text x="496" y="92" text-anchor="middle" class="t">ProfileRunner</text>
          <text x="496" y="107" text-anchor="middle" class="s">HUD regions + rules</text>
          <text x="496" y="120" text-anchor="middle" class="s">game → sub-game → mode</text>
          <line x1="376" y1="98" x2="414" y2="98" class="ar" marker-end="url(#f3a)"/>

          <rect x="616" y="70" width="160" height="56" rx="6" class="bx"/>
          <text x="696" y="92" text-anchor="middle" class="t">Candidates</text>
          <text x="696" y="107" text-anchor="middle" class="m">game.event</text>
          <text x="696" y="120" text-anchor="middle" class="m">clip.candidate</text>
          <line x1="576" y1="98" x2="614" y2="98" class="ar" marker-end="url(#f3a)"/>

          <rect x="816" y="70" width="160" height="56" rx="6" class="bx sess"/>
          <text x="896" y="92" text-anchor="middle" class="t">Shell library</text>
          <text x="896" y="107" text-anchor="middle" class="s">rates candidates</text>
          <text x="896" y="120" text-anchor="middle" class="s">in memory only</text>
          <line x1="776" y1="98" x2="814" y2="98" class="ar" marker-end="url(#f3a)"/>

          <rect x="1006" y="70" width="142" height="56" rx="6" class="bx plan"/>
          <text x="1077" y="92" text-anchor="middle" class="t pt">ClipRating</text>
          <text x="1077" y="107" text-anchor="middle" class="s">1–5 stars, agreed</text>
          <text x="1077" y="120" text-anchor="middle" class="m">clip.rating · #20</text>
          <line x1="976" y1="98" x2="1004" y2="98" class="ar sess" marker-end="url(#f3s)"/>

          <rect x="216" y="200" width="160" height="44" rx="6" class="bx"/>
          <text x="296" y="218" text-anchor="middle" class="t">CalibrationWriter</text>
          <text x="296" y="233" text-anchor="middle" class="s">confirmed numbers only</text>
          <rect x="416" y="200" width="160" height="44" rx="6" class="bx"/>
          <text x="496" y="218" text-anchor="middle" class="t">profiles/**.json</text>
          <text x="496" y="233" text-anchor="middle" class="s">game knowledge as data</text>
          <rect x="616" y="200" width="160" height="44" rx="6" class="bx plan"/>
          <text x="696" y="218" text-anchor="middle" class="t pt">ONNX scorer</text>
          <text x="696" y="233" text-anchor="middle" class="s">in the Clipper, M4</text>
          <rect x="816" y="200" width="160" height="44" rx="6" class="bx plan"/>
          <text x="896" y="218" text-anchor="middle" class="t pt">ml/ training</text>
          <text x="896" y="233" text-anchor="middle" class="s">logistic reg. → ONNX</text>
          <rect x="1006" y="200" width="142" height="44" rx="6" class="bx gate"/>
          <text x="1077" y="218" text-anchor="middle" class="t">RatingStore</text>
          <text x="1077" y="233" text-anchor="middle" class="s">planned · refuses ephemeral</text>

          <polyline points="96,156 96,222 214,222" class="ar" marker-end="url(#f3a)"/>
          <text x="104" y="190" class="m">probe → you confirm</text>
          <line x1="376" y1="222" x2="414" y2="222" class="ar" marker-end="url(#f3a)"/>
          <line x1="496" y1="200" x2="496" y2="128" class="ar" marker-end="url(#f3a)"/>
          <text x="504" y="166" class="m">regions, rules</text>
          <line x1="1077" y1="126" x2="1077" y2="198" class="ar plan" marker-end="url(#f3p)"/>
          <line x1="1006" y1="222" x2="978" y2="222" class="ar plan" marker-end="url(#f3p)"/>
          <line x1="816" y1="222" x2="778" y2="222" class="ar plan" marker-end="url(#f3p)"/>
          <line x1="696" y1="200" x2="696" y2="128" class="ar plan" marker-end="url(#f3p)"/>
          <text x="704" y="166" class="m">model_score</text>
</svg>
