name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the product platform. Linux keeps the platform-neutral
        # core (bus, framing, session log) honest and is faster for PRs.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # FileSource and the testbench decode footage with ffmpeg.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: dotnet restore Lookback.slnx
      - run: dotnet build Lookback.slnx --no-restore -c Release
      - run: dotnet test --solution Lookback.slnx --no-build -c Release
