<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1164 506" width="1164" height="506">
<style>
:root { --bg:#ffffff; --panel:#ffffff; --container:#eaeef3; --ink:#1a2230; --muted:#586274; --line:#c3cbd7; --sess:#a8650f; --plan:#7f8899; --gate:#c0392f;
  --tint-sess:rgba(168,101,15,.08); --tint-gate:rgba(192,57,47,.07); }
@media (prefers-color-scheme: dark) { :root { --bg:#161c26; --panel:#161c26; --container:#131922; --ink:#e3e8f0; --muted:#98a2b4; --line:#2e3746; --sess:#e3a54c; --plan:#737d8f; --gate:#ff7b70;
  --tint-sess:rgba(227,165,76,.09); --tint-gate:rgba(255,123,112,.08); } }
.bg { fill: var(--bg); }
text { font-family: "Segoe UI", "IBM Plex Sans", system-ui, -apple-system, sans-serif; fill: var(--ink); }
.t { font-size: 12.5px; font-weight: 600; } .s { font-size: 11px; fill: var(--muted); }
.m, .cap { font-family: "Cascadia Mono", Consolas, "IBM Plex Mono", ui-monospace, monospace; font-size: 10.5px; fill: var(--muted); }
.cap { letter-spacing: .08em; } .pt { fill: var(--muted); } .sc { fill: var(--sess); } .gc { fill: var(--gate); }
.bx { fill: var(--panel); stroke: var(--ink); stroke-width: 1.3; }
.bx.sess { stroke: var(--sess); stroke-dasharray: 6 4; fill: var(--tint-sess); stroke-width: 1.5; }
.bx.plan { stroke: var(--plan); stroke-dasharray: 2 3; fill: none; stroke-width: 1.4; }
.bx.ext { stroke: var(--line); fill: var(--container); }
.bx.gate { stroke: var(--gate); fill: var(--tint-gate); stroke-width: 1.5; }
.ctr { fill: var(--container); stroke: var(--line); stroke-width: 1.2; } .ctr.sess { stroke: var(--sess); stroke-dasharray: 7 5; }
.ar { stroke: var(--ink); stroke-width: 1.3; fill: none; } .ar.sess { stroke: var(--sess); stroke-dasharray: 5 4; } .ar.plan { stroke: var(--plan); stroke-dasharray: 2 3; }
.gate-line { stroke: var(--gate); stroke-width: 1.6; stroke-dasharray: 7 5; }
.mk { fill: var(--ink); } .mk.sess { fill: var(--sess); } .mk.plan { fill: var(--plan); }
</style>
<rect class="bg" x="0" y="0" width="1164" height="506"/>
<defs>
            <marker id="f1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
            <marker id="f1s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk sess"/></marker>
            <marker id="f1p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk plan"/></marker>
          </defs>

          <!-- left: outside Lookback -->
          <rect x="16" y="64" width="190" height="82" rx="8" class="ctr"/>
          <text x="28" y="84" class="t">Game process</text>
          <rect x="28" y="96" width="166" height="34" rx="6" class="bx plan"/>
          <text x="111" y="117" text-anchor="middle" class="t pt">present hook · M6</text>

          <rect x="16" y="158" width="190" height="34" rx="6" class="bx ext"/>
          <text x="111" y="179" text-anchor="middle" class="t">Audio endpoints</text>

          <rect x="16" y="284" width="190" height="40" rx="6" class="bx plan"/>
          <text x="111" y="301" text-anchor="middle" class="t pt">Signals · Clipper hosts</text>
          <text x="111" y="315" text-anchor="middle" class="s">planned, M2–M4</text>

          <!-- recorder container -->
          <rect x="250" y="36" width="440" height="360" rx="10" class="ctr"/>
          <text x="266" y="58" class="t">Lookback.Recorder <tspan class="s">· C# service, headless</tspan></text>

          <rect x="266" y="72" width="274" height="124" rx="8" class="bx plan"/>
          <text x="278" y="90" class="s">CaptureService · not wired yet (step 6)</text>
          <rect x="278" y="98" width="250" height="26" rx="5" class="bx"/>
          <text x="403" y="115" text-anchor="middle" class="t">Capture + analysis tap</text>
          <rect x="278" y="130" width="250" height="26" rx="5" class="bx"/>
          <text x="403" y="147" text-anchor="middle" class="t">Video encode · NV12 + CFR</text>
          <rect x="278" y="162" width="250" height="26" rx="5" class="bx sess"/>
          <text x="403" y="179" text-anchor="middle" class="t">Audio + AAC · in progress</text>

          <rect x="266" y="216" width="274" height="44" rx="6" class="bx"/>
          <text x="403" y="235" text-anchor="middle" class="t">In-process event bus</text>
          <text x="403" y="250" text-anchor="middle" class="s">protobuf envelopes · raw QPC time</text>

          <rect x="266" y="284" width="130" height="40" rx="6" class="bx"/>
          <text x="331" y="301" text-anchor="middle" class="t">Named-pipe server</text>
          <text x="331" y="315" text-anchor="middle" class="s">framed protobuf</text>

          <rect x="410" y="284" width="130" height="40" rx="6" class="bx"/>
          <text x="475" y="301" text-anchor="middle" class="t">CalibrationHost</text>
          <text x="475" y="315" text-anchor="middle" class="s">ephemeral session</text>

          <rect x="266" y="340" width="274" height="40" rx="6" class="bx gate"/>
          <text x="403" y="357" text-anchor="middle" class="t">RetentionRules</text>
          <text x="403" y="371" text-anchor="middle" class="s">the one gate on writes to disk</text>

          <rect x="556" y="72" width="124" height="308" rx="6" class="bx"/>
          <text x="618" y="92" text-anchor="middle" class="t">WebSocket</text>
          <text x="618" y="107" text-anchor="middle" class="t">bridge</text>
          <text x="618" y="122" text-anchor="middle" class="s">loopback · token</text>
          <text x="618" y="135" text-anchor="middle" class="s">+ Origin check</text>
          <text x="672" y="170" text-anchor="end" class="m">/events</text>
          <text x="672" y="232" text-anchor="end" class="m">/ingest</text>
          <text x="672" y="360" text-anchor="end" class="m">/calibrate</text>

          <!-- internal recorder edges -->
          <line x1="403" y1="196" x2="403" y2="214" class="ar" marker-end="url(#f1a)"/>
          <text x="410" y="209" class="m">signals.*</text>
          <line x1="331" y1="260" x2="331" y2="282" class="ar" marker-end="url(#f1a)"/>
          <line x1="475" y1="284" x2="475" y2="262" class="ar" marker-end="url(#f1a)"/>
          <line x1="540" y1="238" x2="554" y2="238" class="ar" marker-end="url(#f1a)"/>
          <line x1="542" y1="304" x2="554" y2="304" class="ar" marker-start="url(#f1a)" marker-end="url(#f1a)"/>

          <!-- left edges -->
          <line x1="206" y1="111" x2="276" y2="111" class="ar" marker-end="url(#f1a)"/>
          <text x="240" y="105" text-anchor="middle" class="m">WGC/DXGI</text>
          <line x1="206" y1="175" x2="276" y2="175" class="ar sess" marker-end="url(#f1s)"/>
          <text x="240" y="169" text-anchor="middle" class="m">WASAPI</text>
          <line x1="208" y1="304" x2="264" y2="304" class="ar plan" marker-start="url(#f1p)" marker-end="url(#f1p)"/>

          <!-- shell container -->
          <rect x="850" y="36" width="298" height="384" rx="10" class="ctr sess"/>
          <text x="866" y="58" class="t">Electron shell · app/ <tspan class="s">· main process</tspan></text>

          <rect x="866" y="72" width="266" height="40" rx="6" class="bx sess"/>
          <text x="999" y="89" text-anchor="middle" class="t">RecorderHost</text>
          <text x="999" y="103" text-anchor="middle" class="s">spawns it, reads the handshake</text>

          <rect x="866" y="132" width="266" height="64" rx="6" class="bx sess"/>
          <text x="999" y="156" text-anchor="middle" class="t">StreamClient → Library</text>
          <text x="999" y="172" text-anchor="middle" class="s">candidates · QA · saved clips</text>
          <text x="999" y="187" text-anchor="middle" class="s">ratings held in memory for now</text>

          <rect x="866" y="218" width="266" height="44" rx="6" class="bx sess"/>
          <text x="999" y="237" text-anchor="middle" class="t">Viewer + ingest sender</text>
          <text x="999" y="252" text-anchor="middle" class="s">frame subscription → crop → 384x216</text>

          <text x="866" y="290" class="cap">WINDOWS</text>
          <rect x="866" y="298" width="128" height="40" rx="6" class="bx sess"/>
          <text x="930" y="315" text-anchor="middle" class="t">Library</text>
          <text x="930" y="329" text-anchor="middle" class="s">+ live timeline</text>
          <rect x="1004" y="298" width="128" height="40" rx="6" class="bx sess"/>
          <text x="1068" y="315" text-anchor="middle" class="t">Official player</text>
          <text x="1068" y="329" text-anchor="middle" class="s">in-memory partition</text>
          <rect x="866" y="346" width="128" height="40" rx="6" class="bx sess"/>
          <text x="930" y="363" text-anchor="middle" class="t">Calibration</text>
          <text x="930" y="377" text-anchor="middle" class="s">recorder's panel</text>
          <rect x="1004" y="346" width="128" height="40" rx="6" class="bx sess"/>
          <text x="1068" y="363" text-anchor="middle" class="t">Dataset browser</text>
          <text x="1068" y="377" text-anchor="middle" class="s">via testbench browse</text>
          <text x="866" y="408" class="s">Writes only its settings and the browser page.</text>

          <!-- recorder ↔ shell lanes -->
          <line x1="866" y1="92" x2="692" y2="92" class="ar sess" marker-end="url(#f1s)"/>
          <text x="778" y="85" text-anchor="middle" class="s">spawns the recorder</text>
          <text x="778" y="106" text-anchor="middle" class="m">reads LOOKBACK_READY</text>

          <line x1="680" y1="152" x2="864" y2="152" class="ar" marker-end="url(#f1a)"/>
          <text x="778" y="145" text-anchor="middle" class="s">/events · JSON envelopes</text>

          <line x1="866" y1="180" x2="682" y2="180" class="ar sess" marker-end="url(#f1s)"/>
          <text x="778" y="196" text-anchor="middle" class="s sc">rate · save → ack (agreed, not built)</text>

          <line x1="866" y1="240" x2="682" y2="240" class="ar sess" marker-end="url(#f1s)"/>
          <text x="778" y="233" text-anchor="middle" class="s">/ingest · BGRA 384x216, 30 fps</text>
          <text x="778" y="254" text-anchor="middle" class="s">official player only, never stored</text>

          <line x1="680" y1="366" x2="864" y2="366" class="ar" marker-end="url(#f1a)"/>
          <text x="778" y="359" text-anchor="middle" class="s">/calibrate panel page</text>

          <!-- bottom row: CLIs and offline -->
          <text x="250" y="432" class="s">Command-line tools run the same libraries in their own process; they do not talk to the recorder.</text>
          <rect x="16" y="444" width="190" height="46" rx="6" class="bx ext"/>
          <text x="111" y="464" text-anchor="middle" class="t">Footage files</text>
          <text x="111" y="479" text-anchor="middle" class="s">yours, or with permission</text>
          <line x1="206" y1="467" x2="248" y2="467" class="ar" marker-end="url(#f1a)"/>
          <text x="227" y="460" text-anchor="middle" class="m">ffmpeg</text>
          <rect x="250" y="444" width="210" height="46" rx="6" class="bx"/>
          <text x="355" y="464" text-anchor="middle" class="t">lookback-testbench</text>
          <text x="355" y="479" text-anchor="middle" class="s">analyze · live · dataset · browse</text>
          <rect x="476" y="444" width="214" height="46" rx="6" class="bx"/>
          <text x="583" y="464" text-anchor="middle" class="t">lookback-capture</text>
          <text x="583" y="479" text-anchor="middle" class="s">capture · analyse · --encode a clip</text>
          <rect x="850" y="444" width="298" height="46" rx="6" class="bx plan"/>
          <text x="999" y="464" text-anchor="middle" class="t pt">ml/ · offline training → ONNX</text>
          <text x="999" y="479" text-anchor="middle" class="s">M4, waits on rated clips</text>
</svg>
