<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1164 400" width="1164" height="400">
<style>
:root { --bg:#ffffff; --panel:#ffffff; --container:#eaeef3; --ink:#1a2230; --muted:#586274; --line:#c3cbd7; --sess:#a8650f; --plan:#7f8899; --gate:#c0392f;
  --tint-sess:rgba(168,101,15,.08); --tint-gate:rgba(192,57,47,.07); }
@media (prefers-color-scheme: dark) { :root { --bg:#161c26; --panel:#161c26; --container:#131922; --ink:#e3e8f0; --muted:#98a2b4; --line:#2e3746; --sess:#e3a54c; --plan:#737d8f; --gate:#ff7b70;
  --tint-sess:rgba(227,165,76,.09); --tint-gate:rgba(255,123,112,.08); } }
.bg { fill: var(--bg); }
text { font-family: "Segoe UI", "IBM Plex Sans", system-ui, -apple-system, sans-serif; fill: var(--ink); }
.t { font-size: 12.5px; font-weight: 600; } .s { font-size: 11px; fill: var(--muted); }
.m, .cap { font-family: "Cascadia Mono", Consolas, "IBM Plex Mono", ui-monospace, monospace; font-size: 10.5px; fill: var(--muted); }
.cap { letter-spacing: .08em; } .pt { fill: var(--muted); } .sc { fill: var(--sess); } .gc { fill: var(--gate); }
.bx { fill: var(--panel); stroke: var(--ink); stroke-width: 1.3; }
.bx.sess { stroke: var(--sess); stroke-dasharray: 6 4; fill: var(--tint-sess); stroke-width: 1.5; }
.bx.plan { stroke: var(--plan); stroke-dasharray: 2 3; fill: none; stroke-width: 1.4; }
.bx.ext { stroke: var(--line); fill: var(--container); }
.bx.gate { stroke: var(--gate); fill: var(--tint-gate); stroke-width: 1.5; }
.ctr { fill: var(--container); stroke: var(--line); stroke-width: 1.2; } .ctr.sess { stroke: var(--sess); stroke-dasharray: 7 5; }
.ar { stroke: var(--ink); stroke-width: 1.3; fill: none; } .ar.sess { stroke: var(--sess); stroke-dasharray: 5 4; } .ar.plan { stroke: var(--plan); stroke-dasharray: 2 3; }
.gate-line { stroke: var(--gate); stroke-width: 1.6; stroke-dasharray: 7 5; }
.mk { fill: var(--ink); } .mk.sess { fill: var(--sess); } .mk.plan { fill: var(--plan); }
</style>
<rect class="bg" x="0" y="0" width="1164" height="400"/>
<defs>
            <marker id="f2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
            <marker id="f2s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk sess"/></marker>
            <marker id="f2p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk plan"/></marker>
          </defs>

          <line x1="586" y1="6" x2="586" y2="396" class="gate-line"/>
          <text x="570" y="40" text-anchor="end" class="cap">ANALYSIS · ALWAYS ON</text>
          <text x="616" y="40" class="cap gc">PERSIST PATH · ONLY IF RetentionRules.CanPersist</text>

          <polyline points="286,60 286,14 600,14 600,83 614,83" class="ar" marker-end="url(#f2a)"/>
          <text x="440" y="10" text-anchor="middle" class="m">FrameTap: the encode path attaches here</text>

          <!-- left: analysis -->
          <rect x="16" y="60" width="160" height="46" rx="6" class="bx"/>
          <text x="96" y="80" text-anchor="middle" class="t">Capture source</text>
          <text x="96" y="95" text-anchor="middle" class="s">WGC · DXGI · BGRA + QPC</text>
          <rect x="206" y="60" width="160" height="46" rx="6" class="bx"/>
          <text x="286" y="80" text-anchor="middle" class="t">LiveCaptureSession</text>
          <text x="286" y="95" text-anchor="middle" class="s">one device, output's adapter</text>
          <rect x="396" y="60" width="160" height="46" rx="6" class="bx"/>
          <text x="476" y="80" text-anchor="middle" class="t">GpuDownscaler</text>
          <text x="476" y="95" text-anchor="middle" class="s">384x216 compute · ≤ 30 fps</text>
          <rect x="396" y="180" width="160" height="46" rx="6" class="bx"/>
          <text x="476" y="200" text-anchor="middle" class="t">LiveAnalyzer</text>
          <text x="476" y="215" text-anchor="middle" class="s">below-normal worker, drops if behind</text>
          <rect x="206" y="180" width="160" height="46" rx="6" class="bx"/>
          <text x="286" y="200" text-anchor="middle" class="t">Event bus</text>
          <text x="286" y="215" text-anchor="middle" class="s">→ pipes · /events</text>
          <rect x="16" y="300" width="160" height="46" rx="6" class="bx sess"/>
          <text x="96" y="320" text-anchor="middle" class="t">WASAPI capture</text>
          <text x="96" y="335" text-anchor="middle" class="s">loopback + mic · in progress</text>
          <rect x="206" y="300" width="160" height="46" rx="6" class="bx"/>
          <text x="286" y="320" text-anchor="middle" class="t">SampleClock</text>
          <text x="286" y="335" text-anchor="middle" class="s">device position → QPC</text>
          <rect x="396" y="300" width="160" height="46" rx="6" class="bx"/>
          <text x="476" y="320" text-anchor="middle" class="t">LiveAudioAssembler</text>
          <text x="476" y="335" text-anchor="middle" class="s">48 kHz, silence for gaps</text>

          <line x1="176" y1="83" x2="204" y2="83" class="ar" marker-end="url(#f2a)"/>
          <line x1="366" y1="83" x2="394" y2="83" class="ar" marker-end="url(#f2a)"/>
          <line x1="476" y1="106" x2="476" y2="178" class="ar" marker-end="url(#f2a)"/>
          <text x="484" y="147" class="m">BGRA frames</text>
          <line x1="396" y1="203" x2="368" y2="203" class="ar" marker-end="url(#f2a)"/>
          <text x="382" y="196" text-anchor="middle" class="m">signals</text>
          <line x1="176" y1="323" x2="204" y2="323" class="ar sess" marker-end="url(#f2s)"/>
          <line x1="366" y1="323" x2="394" y2="323" class="ar" marker-end="url(#f2a)"/>
          <line x1="476" y1="300" x2="476" y2="228" class="ar" marker-end="url(#f2a)"/>
          <text x="484" y="267" class="m">mono hops</text>

          <!-- right: persist -->
          <rect x="616" y="60" width="140" height="46" rx="6" class="bx"/>
          <text x="686" y="80" text-anchor="middle" class="t">Nv12Converter</text>
          <text x="686" y="95" text-anchor="middle" class="s">scale + BT.709, keeps latest</text>
          <rect x="786" y="60" width="140" height="46" rx="6" class="bx"/>
          <text x="856" y="80" text-anchor="middle" class="t">EncodeTicker</text>
          <text x="856" y="95" text-anchor="middle" class="s">CFR clock at tier fps</text>
          <rect x="956" y="60" width="180" height="46" rx="6" class="bx"/>
          <text x="1046" y="80" text-anchor="middle" class="t">MfVideoEncoder</text>
          <text x="1046" y="95" text-anchor="middle" class="s">NVENC · AMF · QSV · software</text>
          <rect x="616" y="180" width="140" height="46" rx="6" class="bx"/>
          <text x="686" y="200" text-anchor="middle" class="t">Governor</text>
          <text x="686" y="215" text-anchor="middle" class="s">policy built · probe in progress</text>
          <rect x="786" y="180" width="140" height="46" rx="6" class="bx"/>
          <text x="856" y="200" text-anchor="middle" class="t">SegmentStore</text>
          <text x="856" y="215" text-anchor="middle" class="s">2 s fMP4 on disk, budget</text>
          <rect x="956" y="180" width="180" height="46" rx="6" class="bx"/>
          <text x="1046" y="200" text-anchor="middle" class="t">ReplayRing</text>
          <text x="1046" y="215" text-anchor="middle" class="s">RAM, keyframe + QPC index</text>
          <rect x="786" y="300" width="140" height="46" rx="6" class="bx"/>
          <text x="856" y="320" text-anchor="middle" class="t">ClipWriter</text>
          <text x="856" y="335" text-anchor="middle" class="s">→ clips/&lt;id&gt;.mp4, no re-encode</text>
          <rect x="956" y="300" width="180" height="46" rx="6" class="bx sess"/>
          <text x="1046" y="320" text-anchor="middle" class="t">AAC encoder MFT</text>
          <text x="1046" y="335" text-anchor="middle" class="s">48 kHz stereo · in progress</text>

          <line x1="756" y1="83" x2="784" y2="83" class="ar" marker-end="url(#f2a)"/>
          <line x1="926" y1="83" x2="954" y2="83" class="ar" marker-end="url(#f2a)"/>
          <line x1="1046" y1="106" x2="1046" y2="178" class="ar" marker-end="url(#f2a)"/>
          <text x="1054" y="147" class="m">packets</text>
          <line x1="1046" y1="300" x2="1046" y2="228" class="ar sess" marker-end="url(#f2s)"/>
          <text x="1054" y="267" class="m">AAC frames</text>
          <line x1="956" y1="203" x2="928" y2="203" class="ar" marker-end="url(#f2a)"/>
          <line x1="856" y1="226" x2="856" y2="298" class="ar" marker-end="url(#f2a)"/>
          <text x="848" y="267" text-anchor="end" class="m">from disk</text>
          <polyline points="990,226 990,262 900,262 900,298" class="ar" marker-end="url(#f2a)"/>
          <text x="945" y="255" text-anchor="middle" class="m">from RAM</text>
          <line x1="756" y1="203" x2="784" y2="203" class="ar plan" marker-end="url(#f2p)"/>
          <line x1="686" y1="180" x2="686" y2="108" class="ar plan" marker-end="url(#f2p)"/>
          <text x="694" y="147" class="m">tier</text>
          <polyline points="96,346 96,372 1046,372 1046,348" class="ar sess" marker-end="url(#f2s)"/>
          <text x="700" y="389" text-anchor="middle" class="s">stereo PCM + QPC</text>
</svg>
